services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotspot
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes: [hotspot_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot -d hotspot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hotspot_pgdata:
